name: windows-exe
"on":
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Build FndZlda.exe
        run: bash build-windows.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FndZlda-windows
          path: dist/FndZlda.exe
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.4
          name: FndZlda v1.1.4
          files: dist/FndZlda.exe
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Per-store 120s auto-add cooldown. Other shops keep scanning. Discord on every hit.
            Best Buy opens the Pre-Order / add-to-cart button (queue or cart), not /cart.
